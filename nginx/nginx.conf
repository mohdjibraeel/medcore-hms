worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Upstream service names match docker-compose service names —
    # Docker's internal DNS resolves these automatically on the shared network.
    upstream backend_upstream {
        server backend:3000;
    }

    upstream frontend_upstream {
        server frontend:3001;
    }

    server {
        listen 80;

        # --- Backend API ---
        # Strips the /api prefix before forwarding, so NestJS routes
        # (e.g. /auth/login) don't need to know about /api at all.
        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend_upstream;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket upgrade support — not used by the frontend yet,
            # but the NotificationsGateway exists on the backend, so this
            # is here so real-time features work the moment they're wired up.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # --- Everything else -> Next.js frontend ---
        location / {
            proxy_pass http://frontend_upstream;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}